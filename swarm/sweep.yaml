# Hyperparameter sweep config for swarm/sweep_train.py.
#
#   make sweep CONFIG=sweep.yaml
#
# CLI flags override values here. Paths are resolved relative to the
# directory where you invoke `make` — `make sweep` runs from swarm/, so
# `../output/` points at the repo-root output/ directory where DVD-swarm
# writes per-drone CSVs.

data_dir: ../training-data/
primary_type: ATTITUDE
cache_dir: .cache/biLSTM
output_dir: batch512_1layer/

# 1layer | 2layer | both
model: 1layer

# 512 starting for our GPUs, original 64 was starving them
batch_size: 512

# One experiment is dispatched to each GPU; runs in batches of len(gpus).
gpus: [0, 1, 2, 3, 4]

scaler_fit_scope: train_all
test_frac: 0.2
val_frac: 0.2
mixed_precision: true

experiments:
  - {window_size: 60,  stride: 1}
  - {window_size: 80,  stride: 2}
  - {window_size: 120, stride: 5}
  - {window_size: 160, stride: 10}
  - {window_size: 200, stride: 15}
